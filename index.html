<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Canvas</title>
<meta name="description" content="Task lists on a black canvas: draggable cards, colored titles, checkboxes and subtasks.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Canvas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html, body { margin: 0; height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
/* Layout: black free-form canvas of draggable charcoal list cards; single column on phones. */
:root {
  --bg: #000000;
  --card: #2a2a2c;
  --card-edge: #38383b;
  --ink: #ececee;
  --dim: #8e8e93;
  --faint: #56565a;
  --pop: #1c1c1e;
  --danger: #ff6b6b;
  --font: "Aptos Display", "Aptos", "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; min-height: 100%; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [contenteditable]:focus-visible { outline: 2px solid #5aa9ff; outline-offset: 2px; border-radius: 4px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100000;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; background: rgba(0,0,0,.86);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.brand { font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.brand { display: flex; align-items: center; min-width: 0; }
.brand-logo { height: 32px; width: auto; max-width: none; flex: none; display: block; padding: 4px 7px; background: #fff; border-radius: 7px; margin-right: 12px; }
.brand .brand-name { color: inherit; font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
.brand .brand-tag { color: var(--dim); font-weight: 400; letter-spacing: .02em; text-transform: none; font-size: 14px; margin-left: 10px; }
.topbar { gap: 16px; }
.brand { flex: none; }
.tabs { display: flex; gap: 4px; padding: 4px; background: #141415; border: 1px solid var(--card-edge); border-radius: 12px; margin-right: auto; }
.tab {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 8px;
  color: var(--dim); font-size: 14px; font-weight: 600; letter-spacing: .02em; transition: background .15s, color .15s;
}
.tab svg { width: 17px; height: 17px; flex: none; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,.04) inset; }
.ideas-empty { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); width: min(36ch, 100%); text-align: center; color: var(--dim); line-height: 1.5; }
.ideas-empty strong { display: block; color: var(--ink); font-size: 20px; letter-spacing: .06em; text-transform: uppercase; margin: 10px 0 4px; }
.ideas-empty p { margin: 0; }
.ideas-icon { width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; background: var(--card); border: 1px solid var(--card-edge); display: grid; place-items: center; color: #FFD84D; }
.ideas-icon svg { width: 28px; height: 28px; }
#addIdea svg { width: 21px; height: 21px; }
@media (max-width: 1099px) { .brand .brand-tag { display: none; } }
.add-list {
  width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 1px solid var(--card-edge);
  display: grid; place-items: center; transition: background .15s, transform .15s;
}
.add-list:hover { background: #3a3a3d; }
.add-list:active { transform: scale(.94); }
.add-list svg { width: 20px; height: 20px; }

#canvas { position: relative; margin: 0 20px 40px; min-height: 70vh; }
#board, #ideaBoard, #schedBoard { position: absolute; left: 0; top: 0; width: 0; height: 0; margin: 0; }
.add-wrap { position: relative; flex: none; }
.card-grip { display: none; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 72px; height: 22px; place-items: center; color: var(--dim); touch-action: none; cursor: grab; z-index: 2; }
.card-grip svg { width: 26px; height: 6px; }
.card-grip:active { color: var(--ink); }
.card.card-lifting { z-index: 100 !important; box-shadow: 0 18px 40px rgba(0,0,0,.8); opacity: .96; transition: none; }
.card-drop-line { position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: #fff; opacity: .85; pointer-events: none; z-index: 99; }
.add-list.open { background: #3a3a3d; }
.add-menu {
  position: absolute; right: 0; top: 50px; width: 270px; padding: 6px; background: var(--pop); border: 1px solid var(--card-edge);
  border-radius: 12px; box-shadow: 0 16px 36px rgba(0,0,0,.65); display: flex; flex-direction: column; gap: 2px; z-index: 5;
}
.add-menu button { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; text-align: left; }
.add-menu button:hover, .add-menu button:focus-visible { background: rgba(255,255,255,.07); outline: none; }
.add-menu strong { display: block; font-size: 15px; }
.add-menu small { display: block; font-size: 12px; color: var(--dim); margin-top: 1px; }
.am-icon { width: 34px; height: 34px; flex: none; border-radius: 9px; background: var(--card); border: 1px solid var(--card-edge); display: grid; place-items: center; }
.am-icon svg { width: 19px; height: 19px; }
.am-sep { border: 0; border-top: 1px solid var(--card-edge); margin: 4px 6px; }
/* schedule cards */
.items.srows { gap: 2px; margin-left: 0; }
.srow { display: flex; align-items: center; flex-wrap: nowrap; gap: 6px; padding: 5px 0; position: relative; border-bottom: 1px solid rgba(255,255,255,.05); }
.srow:last-child { border-bottom: 0; }
.srow .grip { margin-top: 0; }
.srow:hover .grip, .srow:focus-within .grip { opacity: .8; }
.srow .check { margin-top: 0; }
.srow.done .check { background: var(--list-color); border-color: var(--list-color); }
.srow.done .check svg { opacity: 1; }
.srow.done .ms-text { text-decoration: line-through; text-decoration-color: var(--dim); }
.srow.done > :not(.ms-end):not(.grip):not(.check) { opacity: .55; }
.srow.lifting { z-index: 30; background: #333336; border-radius: 6px; box-shadow: 0 8px 18px rgba(0,0,0,.55); }
.date-pill {
  flex: none; min-width: 54px; padding: 3px 6px; border-radius: 7px; border: 2px solid var(--list-color); color: var(--list-color);
  font-weight: 700; font-size: 12px; letter-spacing: .05em; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.2;
}
.date-pill.no-date { border-style: dashed; border-color: var(--faint); color: var(--faint); font-weight: 600; }
.date-pill:hover { background: color-mix(in srgb, var(--list-color) 14%, transparent); }
.ms-text { flex: 1 1 auto; min-width: 0; font-size: 14.5px; line-height: 1.35; outline: none; overflow-wrap: anywhere; cursor: text; }
.ms-text:empty::before, .bic-text:empty::before { content: attr(data-ph); color: var(--faint); }
.ms-end { display: flex; align-items: center; gap: 6px; flex: none; margin-left: auto; }
.status-pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--s) 16%, transparent); border: 1px solid color-mix(in srgb, var(--s) 40%, transparent); color: var(--ink);
}
.s-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--s); flex: none; }
.status-pill { padding: 0; width: 24px; height: 24px; justify-content: center; flex: none; }
.status-pill .s-label { display: none; }
.status-pill .s-dot { width: 10px; height: 10px; }
.status-pill:hover { background: color-mix(in srgb, var(--s) 30%, transparent); }
.status-opt .s-dot { width: 10px; height: 10px; }
.s-ns { --s: #8e8e93; } .s-ip { --s: #FFB547; } .s-blk { --s: #FF5A5A; } .s-done { --s: #5FD68A; }
.bic { display: inline-flex; align-items: baseline; flex: none; width: 70px; }
.tbic { margin-top: 1px; }
.item.sub .tbic .bic-text { font-style: normal; }
.item.important:not(.done) .tbic .bic-text { color: var(--ink); font-weight: 400; }
.bic-label { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; color: var(--dim); flex: none; }
.bic-text { min-width: 0; flex: 1; font-size: 13px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; overflow-wrap: anywhere; cursor: text; border-bottom: 1px dashed transparent; }
.bic-text:focus { border-bottom-color: var(--faint); text-overflow: clip; overflow-x: auto; scrollbar-width: none; }
.bic-text::-webkit-scrollbar { display: none; }
.sched-meta { margin-top: 8px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.pop-action { display: block; width: 100%; text-align: left; font-size: 14px; padding: 2px 0; color: var(--ink); }
.pop-action:hover { color: var(--list-color); }
.status-pop { width: 170px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.status-opt { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 14px; text-align: left; }
.status-opt:hover, .status-opt[aria-pressed="true"] { background: rgba(255,255,255,.07); }
.cal-pop { width: 256px; padding: 10px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.cal-title { font-weight: 700; font-size: 14px; }
.cal-nav { width: 30px; height: 30px; border-radius: 7px; font-size: 20px; line-height: 1; color: var(--dim); }
.cal-nav:hover { background: rgba(255,255,255,.08); color: var(--ink); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-dow span { font-size: 11px; font-weight: 700; color: var(--faint); padding: 4px 0; }
.cal-day { aspect-ratio: 1; border-radius: 7px; font-size: 13px; font-variant-numeric: tabular-nums; max-width: 100%; }
.cal-day:hover { background: rgba(255,255,255,.08); }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--faint); }
.cal-day.sel { background: var(--list-color); color: #000; font-weight: 700; box-shadow: none; }
.cal-foot { display: flex; justify-content: space-between; margin-top: 8px; }
.cal-foot button { font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 6px; color: var(--list-color); }
.cal-foot button:hover { background: rgba(255,255,255,.07); }
.cal-foot .cal-clear { color: var(--dim); }
.sched-icon { color: #5AA9FF; }
/* idea cards */
.tag-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 17px; letter-spacing: .05em; line-height: 1.3; padding-top: 2px; cursor: pointer; border-radius: 6px; outline-offset: 3px; }
.tag-btn .tag-name { overflow-wrap: anywhere; }
.tag-btn .caret { width: 16px; height: 16px; flex: none; opacity: .8; }
.idea-card.untagged .tag-name { letter-spacing: .12em; }
.idea-card.untagged .card-head { border-bottom-style: solid; }
.idea-text {
  margin-top: 12px; min-height: 96px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; outline: none; cursor: text;
  padding: 10px 12px; margin-left: -4px; margin-right: -4px; border-radius: 8px; background: #232325; border: 1px solid transparent; transition: border-color .15s;
}
.idea-text:focus { border-color: var(--card-edge); }
.idea-text:empty::before { content: attr(data-ph); color: var(--faint); }
.idea-meta { margin-top: 8px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.suggest { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.suggest-label { font-size: 12px; color: var(--dim); margin-right: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: color-mix(in srgb, var(--chip) 16%, transparent); color: var(--ink); border: 1px solid color-mix(in srgb, var(--chip) 45%, transparent);
}
.chip:hover { background: color-mix(in srgb, var(--chip) 28%, transparent); }
.chip[aria-pressed="true"] { background: var(--chip); color: #000; }
.chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip); }
.chip[aria-pressed="true"] .chip-dot { background: #000; }
.tag-pop { left: 10px; right: auto; width: 270px; max-width: calc(100vw - 48px); }
.new-tag { display: flex; gap: 6px; }
.new-tag input { flex: 1; min-width: 0; background: #2a2a2c; border: 1px solid var(--card-edge); border-radius: 7px; padding: 6px 8px; color: var(--ink); font: inherit; font-size: 14px; }
.new-tag input:focus { outline: none; border-color: #5aa9ff; }
.new-tag button { padding: 6px 12px; border-radius: 7px; background: var(--card-edge); font-size: 13px; font-weight: 700; }
.empty {
  position: absolute; left: 0; top: 60px; color: var(--dim); max-width: 34ch; line-height: 1.5;
}
.empty strong { color: var(--ink); display: block; font-size: 20px; margin-bottom: 6px; }

.card {
  position: absolute; width: 420px; background: var(--card); border: 1px solid var(--card-edge);
  border-radius: 10px; padding: 14px 16px 12px 20px; box-shadow: 0 6px 20px rgba(0,0,0,.5);
  transition: box-shadow .15s;
}
.card { -webkit-touch-callout: none; }
.card.highlight { border: 3px solid var(--list-color); padding: 12px 14px 10px 18px; }
.card.lp-pulse, .ideas-icon.lp-pulse { animation: lpPulse .28s ease; }
@keyframes lpPulse { 50% { transform: scale(1.015); } }
.card.dragging { box-shadow: 0 18px 40px rgba(0,0,0,.75); cursor: grabbing; opacity: .97; }
.card-head {
  display: flex; align-items: flex-start; gap: 8px; padding-bottom: 8px;
  border-bottom: 3px solid currentColor; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.card.collapsed .card-head { border-bottom-color: transparent; padding-bottom: 0; }
.title {
  flex: 1; min-width: 0; font-weight: 700; font-size: 17px; letter-spacing: .05em; text-transform: uppercase;
  line-height: 1.3; overflow-wrap: anywhere; padding-top: 2px;
}
.title[contenteditable="true"] { cursor: text; user-select: text; -webkit-user-select: text; outline: none; }
.head-btn { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; flex: none; color: var(--dim); }
.head-btn:hover { background: rgba(255,255,255,.08); color: var(--ink); }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--list-color); box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
.chev { width: 18px; height: 18px; transition: transform .2s; }
.card.collapsed .chev { transform: rotate(-90deg); }
.card.collapsed .card-body { display: none; }

.items { list-style: none; margin: 10px 0 0 -20px; padding: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
.item { display: flex; align-items: flex-start; gap: 10px; padding: 3px 0; position: relative; }
.item.sub { padding-left: 44px; gap: 8px; }
.grip {
  flex: none; width: 22px; height: 24px; margin-right: -12px; margin-top: -2px; display: grid; place-items: center;
  color: var(--dim); cursor: grab; touch-action: none; opacity: .45; transition: opacity .12s;
}
.item.sub .grip { margin-right: -10px; }
.grip svg { width: 10px; height: 14px; }
.item:hover .grip, .item:focus-within .grip { opacity: .8; }
.grip:hover { opacity: 1 !important; color: var(--ink); }
.item { -webkit-touch-callout: none; }
.item.lifting { z-index: 30; background: #333336; border-radius: 6px; box-shadow: 0 8px 18px rgba(0,0,0,.55); pointer-events: none; }
.item.lifting .grip { opacity: 1; cursor: grabbing; }
.card.drop-target { border-color: var(--list-color); box-shadow: 0 0 0 2px var(--list-color), 0 6px 20px rgba(0,0,0,.5); }
.drop-line { position: absolute; left: 16px; right: 0; height: 3px; border-radius: 2px; background: var(--list-color); pointer-events: none; z-index: 2; }
body.item-drag, body.item-drag * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.check {
  flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 5px; border: 2px solid var(--dim);
  display: grid; place-items: center; transition: background .12s, border-color .12s;
}
.item.sub .check { width: 14px; height: 14px; border-radius: 4px; margin-top: 3px; border-width: 1.75px; }
.check svg { width: 12px; height: 12px; opacity: 0; }
.item.sub .check svg { width: 9px; height: 9px; }
.item.done .check { background: var(--list-color); border-color: var(--list-color); }
.item.done .check svg { opacity: 1; }
.bang { display: none; font-weight: 800; font-size: 12px; line-height: 1; color: var(--list-color); font-style: normal; }
.item.important:not(.done) .check { border-color: var(--list-color); }
.item.important:not(.done) .check svg { display: none; }
.item.important:not(.done) .bang { display: block; }
.item.sub .bang { font-size: 9.5px; }
.item.important:not(.done) .text { font-weight: 700; color: var(--list-color); }
.item.imp-pulse { animation: impPulse .3s ease; }
@keyframes impPulse { 50% { transform: scale(1.03); } }
.text { flex: 1; min-width: 0; line-height: 1.35; outline: none; overflow-wrap: anywhere; cursor: text; }
.item.sub .text { font-size: 14px; font-style: italic; }
.item.done { opacity: .5; }
.item.done .text { color: var(--ink); text-decoration: line-through; text-decoration-color: var(--dim); text-decoration-thickness: 1.5px; }
.item { transition: opacity .2s; }
.trash-btn svg, .idea-del svg { width: 17px; height: 17px; }
.trash-btn:disabled { opacity: .3; cursor: default; }
.trash-btn:disabled:hover { background: none; color: var(--dim); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 100001;
  display: flex; align-items: center; gap: 14px; background: #3a3a3d; color: var(--ink); border-radius: 10px;
  padding: 10px 12px 10px 16px; box-shadow: 0 10px 28px rgba(0,0,0,.6); font-size: 14px; max-width: calc(100% - 32px);
}
.toast button { font-weight: 700; color: #5aa9ff; padding: 4px 6px; border-radius: 6px; }
.toast button:hover { background: rgba(255,255,255,.08); }
.text:empty::before { content: "Task"; color: var(--faint); }
.indent {
  flex: none; width: 24px; height: 22px; border-radius: 5px; color: var(--dim); display: none; place-items: center;
}
.indent svg { width: 15px; height: 15px; }
.item:focus-within .indent { display: grid; }
.indent:hover { background: rgba(255,255,255,.08); color: var(--ink); }
.add-task {
  display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 4px 0; color: var(--dim); font-size: 14px;
}
.add-task:hover { color: var(--ink); }
.add-task svg { width: 18px; height: 18px; }

.pop {
  position: absolute; top: 46px; right: 10px; z-index: 5; width: 220px; background: var(--pop);
  border: 1px solid var(--card-edge); border-radius: 10px; padding: 12px; box-shadow: 0 14px 30px rgba(0,0,0,.6);
}
.pop-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.sw { aspect-ratio: 1; border-radius: 50%; max-width: 100%; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--pop), 0 0 0 4px var(--ink); }
.custom { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--dim); }
.custom input { width: 34px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }
.pop hr { border: 0; border-top: 1px solid var(--card-edge); margin: 12px 0 10px; }
.del { color: var(--danger); font-size: 14px; }
.confirm { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
.confirm button { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--card-edge); color: var(--ink); font-size: 13px; }
.confirm .yes { background: var(--danger); border-color: var(--danger); color: #000; font-weight: 700; }

.status { position: fixed; left: 20px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--faint); z-index: 100000; }

/* iPhone: one stacked column */
@media (max-width: 699px) {
  .topbar { padding: 12px 16px; flex-wrap: wrap; row-gap: 10px; }
  .tabs { order: 3; flex-basis: 100%; margin-right: 0; }
  .tab { flex: 1; justify-content: center; padding: 8px 6px; gap: 6px; font-size: 13px; }
  .tab svg { width: 15px; height: 15px; }
  .tab-long { display: none; }
  .bic { width: 64px; }
  .ideas-empty { position: static; transform: none; margin: 50px auto 0; }
  .brand .brand-tag { display: none; }
  .brand-logo { height: 28px; margin-right: 10px; }
  #canvas { margin: 4px 16px 60px; display: flex; flex-direction: column; gap: 24px; min-height: 0; width: auto !important; height: auto !important; }

    grip4: '<svg viewBox="0 0 26 6" fill="currentColor"><circle cx="3" cy="3" r="2.2"/><circle cx="9.67" cy="3" r="2.2"/><circle cx="16.33" cy="3" r="2.2"/><circle cx="23" cy="3" r="2.2"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>',
    indent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M10 12h10M4 18h16M4 10l3 2-3 2"/></svg>',
    outdent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M10 12h10M4 18h16M7 10l-3 2 3 2"/></svg>'
  };

  /* ---------- persistence ---------- */
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify([...lists.values()])); } catch (e) {}
  }
  function loadLocal() {
    try { const a = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); if (Array.isArray(a)) a.forEach(l => lists.set(l.id, l)); } catch (e) {}
  }
  function clean(l) {
    return { id: l.id, title: l.title, color: l.color, x: Math.round(l.x), y: Math.round(l.y), z: l.z, m: typeof l.m === "number" ? l.m : null, collapsed: !!l.collapsed, highlight: !!l.highlight, created: l.created,
      items: l.items.map(i => ({ id: i.id, text: i.text, done: !!i.done, indent: i.indent ? 1 : 0, important: !!i.important, bic: i.bic || "" })) };
  }
  function scheduleSave(id, delay = 500) {
    pending.add(id);
    saveLocal();
    clearTimeout(timers.get(id));
    timers.set(id, setTimeout(() => flush(id), delay));
  }
  function flush(id) {
    timers.delete(id);
    if (!db) { pending.delete(id); return; }
    const prev = chains.get(id) || Promise.resolve();
    const next = prev.then(async () => {
      const l = lists.get(id);
      try {
        if (l) await db.doc("lists/" + id).set(clean(l));
        else await db.doc("lists/" + id).delete();
        showStatus("Saved");
      } catch (e) {
        showStatus(e && e.code === "quota_exceeded" ? "Storage is full. Delete a list to save new ones." : "Couldn't save. Your changes are kept on this device.");
      }
    });
    chains.set(id, next);
    next.then(() => { if (!timers.has(id)) pending.delete(id); });
  }
  let statusT;
  function showStatus(msg) {
    statusEl.textContent = msg;
    clearTimeout(statusT);
    statusT = setTimeout(() => (statusEl.textContent = ""), 1800);
  }

  /* ---------- rendering ---------- */
  function renderAll() {
    const ids = new Set(lists.keys());
    board.querySelectorAll(".card").forEach(c => { if (!ids.has(c.dataset.id)) c.remove(); });
    lists.forEach((_, id) => renderCard(id));
    renderEmpty();
    layout();
  }
  function renderEmpty() {
    let e = canvasEl.querySelector(".empty");
    let total = lists.size;
    try { total += ideas.size + scheds.size; } catch (err) {}
    if (total === 0) {
      if (!e) {
        e = document.createElement("div");
        e.className = "empty";
        e.innerHTML = "<strong>Nothing here yet</strong>Tap the + button at the top right to add a Task, Schedule or Note card.";
        canvasEl.appendChild(e);
      }
    } else if (e) e.remove();
  }

  function cardEl(id) { return board.querySelector(`.card[data-id="${id}"]`); }

  /* ---------- one shared canvas for task, schedule and note cards ---------- */
  const canvasEl = document.getElementById("canvas");
  const viewW = () => document.documentElement.clientWidth - 40;
  function allCards() {
    const out = [];
    lists.forEach(l => out.push({ o: l, el: cardEl(l.id), w: CARD_W, save: () => scheduleSave(l.id, 200) }));
    try { ideas.forEach(n => out.push({ o: n, el: ideaEl(n.id), w: CARD_W, save: () => iScheduleSave(n.id, 200) })); } catch (e) {}
    try { const sw = schedW() || CARD_W; scheds.forEach(s => out.push({ o: s, el: schedEl(s.id), w: sw, save: () => sScheduleSave(s.id, 200) })); } catch (e) {}
    return out;
  }
  function findSpot(w) {
    const avail = Math.max(w, viewW());
    const rects = allCards().map(c => ({ x: c.o.x, y: c.o.y, w: c.w, h: c.el ? c.el.offsetHeight : 200 }));
    for (let y = 16; y < 20000; y += 24) {
      for (let x = 0; x + w <= avail || x === 0; x += 24) {
        const r = { x, y, w, h: 180 };
        const hit = rects.some(o => r.x < o.x + o.w + GAP && r.x + r.w + GAP > o.x && r.y < o.y + o.h + GAP && r.y + r.h + GAP > o.y);
        if (!hit) return { x, y };
        if (x + w > avail) break;
      }
    }
    return { x: 0, y: 16 };
  }
  // Line all cards up in columns (shortest column first), keeping their reading order
  function tidyUp() {
    const cards = allCards().sort((a, b) => (a.o.y - b.o.y) || (a.o.x - b.o.x));
    const cols = Math.max(1, Math.floor((viewW() + GAP) / (CARD_W + GAP)));
    const heights = Array(cols).fill(16);
    cards.forEach(c => {
      const col = heights.indexOf(Math.min(...heights));
      c.o.x = col * (CARD_W + GAP);
      c.o.y = heights[col];
      heights[col] += (c.el ? c.el.offsetHeight : 200) + GAP;
      if (c.el) { c.el.style.left = c.o.x + "px"; c.el.style.top = c.o.y + "px"; }
      c.save();
    });
    arrange();
    scrollTo({ top: 0, behavior: "smooth" });
  }
  const globalTopZ = () => Math.max(0, ...allCards().map(c => c.o.z || 0)) + 1;
  /* ---------- phone order: its own sequence, so reordering on iPhone never moves cards on the big screen ---------- */
  const hasM = o => typeof o.m === "number";
  const phoneCmp = (a, b) => ((hasM(a.o) ? a.o.m : Infinity) - (hasM(b.o) ? b.o.m : Infinity)) || (a.o.y - b.o.y) || (a.o.x - b.o.x);
  function ensureM() {
    const cards = allCards();
    if (cards.every(c => hasM(c.o))) return;
    cards.sort(phoneCmp).forEach((c, i) => { if (c.o.m !== i) { c.o.m = i; c.save(); } });
  }
  function nextM() { ensureM(); return Math.max(-1, ...allCards().map(c => (hasM(c.o) ? c.o.m : -1))) + 1; }

  // drag a card up or down by its grip (phones only)
  let cd = null;
  canvasEl.addEventListener("pointerdown", e => {
    const g = e.target.closest(".card-grip");
    if (!g || !isPhone() || (e.button !== 0 && e.pointerType === "mouse")) return;
    e.preventDefault();
    e.stopPropagation();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const card = g.closest(".card");
    const order = allCards().filter(c => c.el).sort(phoneCmp);
    const me = order.find(c => c.el === card);
    const line = document.createElement("div");
    line.className = "card-drop-line";
    line.hidden = true;
    canvasEl.appendChild(line);
    card.classList.add("dragging", "card-lifting");
    cd = { pid: e.pointerId, card, me, order, sy: e.clientY, scy: scrollY, y: e.clientY, line, slot: null, raf: 0 };
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    const step = () => {
      if (!cd) return;
      const edge = 80;
      let v = 0;
      if (cd.y < edge) v = -(edge - cd.y) / 5; else if (cd.y > innerHeight - edge) v = (cd.y - (innerHeight - edge)) / 5;
      if (v) { scrollBy(0, v); cardMove(cd.y); }
      cd.raf = requestAnimationFrame(step);
    };
    cd.raf = requestAnimationFrame(step);
  });
  function cardMove(y) {
    if (!cd) return;
    cd.y = y;
    cd.card.style.transform = `translateY(${y - cd.sy + (scrollY - cd.scy)}px)`;
    const others = cd.order.filter(c => c !== cd.me);
    const cTop = canvasEl.getBoundingClientRect().top;
    let best = null, bd = Infinity;
    for (let k = 0; k <= others.length; k++) {
      let gy;
      if (k === 0) gy = others.length ? others[0].el.getBoundingClientRect().top - 7 : cTop;
      else gy = others[k - 1].el.getBoundingClientRect().bottom + 7;
      const d = Math.abs(y - gy);
      if (d < bd) { bd = d; best = { k, gy }; }
    }
    cd.slot = best.k;
    cd.line.hidden = false;
    cd.line.style.top = (best.gy - cTop - 1.5) + "px";
  }
  canvasEl.addEventListener("pointermove", e => { if (cd && e.pointerId === cd.pid) { e.preventDefault(); cardMove(e.clientY); } });
  const cardEnd = e => {
    if (!cd || e.pointerId !== cd.pid) return;
    const d = cd; cd = null;
    cancelAnimationFrame(d.raf);
    d.line.remove();
    d.card.classList.remove("dragging", "card-lifting");
    d.card.style.transform = "";
    if (e.type !== "pointerup" || d.slot == null) return;
    const others = d.order.filter(c => c !== d.me);
    others.splice(d.slot, 0, d.me);
    others.forEach((c, i) => { if (c.o.m !== i) { c.o.m = i; c.save(); } });
    arrange();
  };
  canvasEl.addEventListener("pointerup", cardEnd);
  canvasEl.addEventListener("pointercancel", cardEnd);

  function arrange() {
    const cards = allCards();
    if (isPhone()) {
      canvasEl.style.width = ""; canvasEl.style.height = "";
      ensureM();
      cards.sort(phoneCmp).forEach((c, i) => { if (c.el) c.el.style.order = i; });
      return;
    }
    let w = 0, h = 0;
    cards.forEach(c => { w = Math.max(w, c.o.x + c.w); h = Math.max(h, c.o.y + (c.el ? c.el.offsetHeight : 200)); });
    canvasEl.style.width = Math.max(w + 40, viewW()) + "px";
    canvasEl.style.height = (h + 120) + "px";
  }

  function renderCard(id) {
    const l = lists.get(id);
    let card = cardEl(id);
    if (!card) {
      card = document.createElement("article");
      card.className = "card";
      card.dataset.id = id;
      card.innerHTML = `
        <header class="card-head">
          <span class="card-grip" aria-label="Drag to reorder card" title="Drag to reorder">${icon.grip4}</span><div class="title" role="heading" aria-level="2"></div>
          <button class="head-btn color-btn" aria-label="Title color and list options" title="Title color"><span class="dot"></span></button>
          <button class="head-btn trash-btn" aria-label="Delete completed tasks" title="Delete completed tasks">${icon.trash}</button>
          <button class="head-btn toggle" aria-label="Collapse list" title="Collapse or expand">${icon.chev}</button>
        </header>
        <div class="card-body">
          <ul class="items"></ul>
          <button class="add-task">${icon.plus}Add task</button>
        </div>`;
      board.appendChild(card);
      wireCard(card);
    }
    card.style.color = "";
    card.querySelector(".card-head").style.color = l.color;
    card.style.setProperty("--list-color", l.color);
    const t = card.querySelector(".title");
    if (t.getAttribute("contenteditable") !== "true") t.textContent = l.title || "UNTITLED";
    card.classList.toggle("collapsed", !!l.collapsed);
    card.classList.toggle("highlight", !!l.highlight);
    card.querySelector(".toggle").setAttribute("aria-label", l.collapsed ? "Expand list" : "Collapse list");
    card.querySelector(".toggle").setAttribute("aria-expanded", String(!l.collapsed));
    renderItems(card, l);
    position(card, l);
  }
  function updateTrash(card, l) {
    const n = l.items.filter(i => i.done).length;
    const b = card.querySelector(".trash-btn");
    b.disabled = n === 0;
    b.title = n ? `Delete ${n} completed task${n > 1 ? "s" : ""}` : "No completed tasks";
  }

  // Completed tasks sink to the bottom: within a task's subtasks, and main tasks within the card.
  function sortDone(items) {
    const blocks = [];
    items.forEach(it => {
      if (!it.indent || !blocks.length) blocks.push({ head: it, subs: [] });
      else blocks[blocks.length - 1].subs.push(it);
    });
    // order: important (not done) first, then regular, then done
    const rank = i => (i.done ? 2 : i.important ? 0 : 1);
    const byRank = (arr, f) => [0, 1, 2].flatMap(r => arr.filter(x => rank(f(x)) === r));
    blocks.forEach(b => { b.subs = byRank(b.subs, x => x); });
    const ordered = byRank(blocks, b => b.head);
    return ordered.flatMap(b => [b.head, ...b.subs]);
  }
  function animateReorder(card, l, mutate) {
    const ul = card.querySelector(".items");
    const before = new Map();
    ul.querySelectorAll(".item").forEach(li => before.set(li.dataset.iid, li.getBoundingClientRect().top));
    mutate();
    renderItems(card, l);
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    ul.querySelectorAll(".item").forEach(li => {
      const b = before.get(li.dataset.iid);
      if (b == null) return;
      const d = b - li.getBoundingClientRect().top;
      if (!d) return;
      li.style.transition = "none";
      li.style.transform = `translateY(${d}px)`;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        li.style.transition = "transform .3s ease, opacity .2s";
        li.style.transform = "";
      }));
    });
  }

  let undoState = null, toastT;
  function showUndo(msg, restore) {
    const t = document.getElementById("toast");
    document.getElementById("toastMsg").textContent = msg;
    undoState = restore;
    t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; undoState = null; }, 6000);
  }

  function renderItems(card, l) {
    const ul = card.querySelector(".items");
    updateTrash(card, l);
    ul.textContent = "";
    l.items.forEach(it => {
      const li = document.createElement("li");
      li.className = "item" + (it.indent ? " sub" : "") + (it.done ? " done" : "") + (it.important ? " important" : "");
      li.dataset.iid = it.id;
      li.innerHTML = `
        <span class="grip" aria-hidden="true" title="Drag to reorder">${icon.grip}</span>
        <button class="check" role="checkbox" aria-checked="${it.done}" aria-label="${it.important ? "Important " : ""}${it.indent ? "subtask" : "task"} done">${icon.check}<span class="bang" aria-hidden="true">!</span></button>
        <div class="text" contenteditable="true" spellcheck="true" autocapitalize="sentences"></div>
        <span class="bic tbic"><span class="bic-text" contenteditable="true" spellcheck="false" autocapitalize="words" data-ph="Owner"></span></span>
        <button class="indent" tabindex="-1" aria-label="${it.indent ? "Make a task" : "Make a subtask"}" title="${it.indent ? "Outdent (Shift+Tab)" : "Indent (Tab)"}">${it.indent ? icon.outdent : icon.indent}</button>`;
      li.querySelector(".text").textContent = it.text;
      li.querySelector(".bic-text").textContent = it.bic || "";
      ul.appendChild(li);
    });
  }

  function position(card, l) {
    card.style.left = l.x + "px";
    card.style.top = l.y + "px";
    card.style.zIndex = l.z || 1;
  }

  function layout() { arrange(); }

  /* ---------- geometry for new cards ---------- */
  function freeSpot() { return findSpot(CARD_W); }
  const topZ = () => globalTopZ();

  function addList() {
    const id = uid();
    const spot = freeSpot();
    const used = [...lists.values()].map(l => l.color);
    const color = COLORS.find(c => !used.includes(c)) || COLORS[lists.size % COLORS.length];
    const l = { id, title: "NEW LIST", color, x: spot.x, y: spot.y, z: topZ(), m: nextM(), collapsed: false, created: Date.now(), items: [] };
    lists.set(id, l);
    renderEmpty();
    renderCard(id);
    layout();
    scheduleSave(id, 50);
    const card = cardEl(id);
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    editTitle(card, true);
  }

  /* ---------- caret helpers ---------- */
  function caretOffset(el) {
    const s = getSelection();
    if (!s.rangeCount || !el.contains(s.anchorNode)) return el.textContent.length;
    const r = s.getRangeAt(0), pre = r.cloneRange();
    pre.selectNodeContents(el);
    pre.setEnd(r.endContainer, r.endOffset);
    return pre.toString().length;
  }
  function setCaret(el, pos) {
    el.focus();
    const s = getSelection(), r = document.createRange();
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let node, left = pos, placed = false;
    while ((node = walker.nextNode())) {
      if (left <= node.length) { r.setStart(node, left); placed = true; break; }
      left -= node.length;
    }
    if (!placed) { r.selectNodeContents(el); r.collapse(false); } else r.collapse(true);
    s.removeAllRanges(); s.addRange(r);
  }
  function focusItem(card, iid, pos) {
    const t = card.querySelector(`.item[data-iid="${iid}"] .text`);
    if (t) setCaret(t, pos == null ? t.textContent.length : pos);
  }

  /* ---------- title editing ---------- */
  function editTitle(card, selectAll) {
    const t = card.querySelector(".title");
    t.setAttribute("contenteditable", "true");
    t.focus();
    const s = getSelection(), r = document.createRange();
    r.selectNodeContents(t);
    if (!selectAll) r.collapse(false);
    s.removeAllRanges(); s.addRange(r);
  }
  function commitTitle(card) {
    const t = card.querySelector(".title");
    if (t.getAttribute("contenteditable") !== "true") return;
    t.setAttribute("contenteditable", "false");
    const l = lists.get(card.dataset.id);
    if (!l) return;
    const v = t.textContent.replace(/\s+/g, " ").trim().toUpperCase() || "UNTITLED";
    t.textContent = v;
    if (v !== l.title) { l.title = v; scheduleSave(l.id); }
  }

  /* ---------- card wiring ---------- */
  function wireCard(card) {
    const id = card.dataset.id;
    const L = () => lists.get(id);
    const head = card.querySelector(".card-head");

    // Long-press the card's edge or empty space to toggle a highlight border
    let lp = null, lpFired = false;
    const lpCancel = () => { if (lp) { clearTimeout(lp.timer); lp = null; } };
    const lpStart = (target, x, y) => {
      lpFired = false;
      lpCancel();
      if (target.closest(".item, button, .pop, .add-task, .card-grip, [contenteditable='true']")) return;
      lp = { x, y, timer: setTimeout(() => {
        lp = null;
        lpFired = true;
        drag = null;
        card.classList.remove("dragging");
        const l = L();
        l.highlight = !l.highlight;
        card.classList.toggle("highlight", l.highlight);
        card.classList.remove("lp-pulse"); void card.offsetWidth; card.classList.add("lp-pulse");
        if (navigator.vibrate) try { navigator.vibrate(15); } catch (err) {}
        layout();
        scheduleSave(id, 200);
      }, 500) };
    };
    const lpMove = (x, y) => { if (lp && Math.hypot(x - lp.x, y - lp.y) > 8) lpCancel(); };
    // mouse / pen
    card.addEventListener("pointerdown", e => { if (e.pointerType !== "touch" && e.button === 0) lpStart(e.target, e.clientX, e.clientY); });
    card.addEventListener("pointermove", e => { if (e.pointerType !== "touch") lpMove(e.clientX, e.clientY); });
    card.addEventListener("pointerup", e => { if (e.pointerType !== "touch") lpCancel(); });
    // touch (touch events aren't interrupted by the browser's own long-press handling)
    card.addEventListener("touchstart", e => { if (e.touches.length === 1) lpStart(e.target, e.touches[0].clientX, e.touches[0].clientY); else lpCancel(); }, { passive: true });
    card.addEventListener("touchmove", e => { const t = e.touches[0]; if (t) lpMove(t.clientX, t.clientY); }, { passive: true });
    card.addEventListener("touchend", e => { lpCancel(); if (lpFired) e.preventDefault(); }, { passive: false });
    card.addEventListener("touchcancel", lpCancel);
    card.addEventListener("contextmenu", e => { if (lp || lpFired) e.preventDefault(); });
    card.addEventListener("click", e => { if (lpFired && e.target.closest(".title")) { e.stopImmediatePropagation(); lpFired = false; } }, true);
    const title = card.querySelector(".title");

    // Drag (desktop / iPad) + tap title to edit
    let drag = null;
    head.addEventListener("pointerdown", e => {
      if (e.button !== 0 || e.target.closest("button")) return;
      if (title.getAttribute("contenteditable") === "true") return;
      if (isPhone()) return;
      e.preventDefault();
      const l = L();
      drag = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, ox: l.x, oy: l.y, moved: false, onTitle: !!e.target.closest(".title") };
      head.setPointerCapture(e.pointerId);
    });
    head.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== drag.pid) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) < 5) return;
      const l = L();
      if (!drag.moved) {
        drag.moved = true;
        card.classList.add("dragging");
        l.z = topZ();
        card.style.zIndex = l.z;
        if (document.activeElement && card.contains(document.activeElement)) document.activeElement.blur();
      }
      l.x = Math.max(0, drag.ox + dx);
      l.y = Math.max(0, drag.oy + dy);
      card.style.left = l.x + "px";
      card.style.top = l.y + "px";
    });
    const endDrag = e => {
      if (!drag || e.pointerId !== drag.pid) return;
      const d = drag; drag = null;
      card.classList.remove("dragging");
      if (d.moved) { scheduleSave(id, 200); layout(); }

    };

    head.addEventListener("pointercancel", endDrag);

    title.addEventListener("click", () => { if (isPhone() && title.getAttribute("contenteditable") !== "true") editTitle(card, false); });

    title.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        commitTitle(card);
        const l = L();
        if (l.collapsed) return;
        if (!l.items.length) { l.items.push({ id: uid(), text: "", done: false, indent: 0 }); renderItems(card, l); scheduleSave(id); layout(); }
        focusItem(card, l.items[0].id);
      } else if (e.key === "Escape") { e.preventDefault(); title.blur(); }
    });
    title.addEventListener("blur", () => commitTitle(card));
    title.addEventListener("paste", plainPaste);

    // Collapse
    card.querySelector(".toggle").addEventListener("click", () => {
      const l = L();
      l.collapsed = !l.collapsed;
      renderCard(id);
      layout();
      scheduleSave(id, 200);
    });

    // Delete completed tasks (with undo)
    card.querySelector(".trash-btn").addEventListener("click", () => {
      const l = L();
      const done = l.items.filter(i => i.done);
      if (!done.length) return;
      const prev = l.items.map(i => ({ ...i }));
      l.items = l.items.filter(i => !i.done);
      renderItems(card, l);
      layout();
      scheduleSave(id, 200);
      showUndo(`Deleted ${done.length} completed task${done.length > 1 ? "s" : ""}`, () => {
        const cur = lists.get(id);
        if (!cur) return;
        cur.items = prev;
        const c = cardEl(id);
        if (c) renderItems(c, cur);
        layout();
        scheduleSave(id, 200);
      });
    });

    // Color popover
    card.querySelector(".color-btn").addEventListener("click", e => {
      e.stopPropagation();
      const open = card.querySelector(".pop");
      closePops();
      if (!open) openPop(card);
    });

    // Add task
    card.querySelector(".add-task").addEventListener("click", () => {
      const l = L();
      const last = l.items[l.items.length - 1];
      if (last && !last.text.trim()) { focusItem(card, last.id); return; }
      const it = { id: uid(), text: "", done: false, indent: 0 };
      l.items.push(it);
      renderItems(card, l);
      layout();
      scheduleSave(id);
      focusItem(card, it.id);
    });

    const ul = card.querySelector(".items");
    const itemOf = el => { const li = el.closest(".item"); return li ? L().items.find(i => i.id === li.dataset.iid) : null; };

    let sinkT;
    ul.addEventListener("click", e => {
      const chk = e.target.closest(".check");
      if (chk) {
        const it = itemOf(chk);
        const l = L();
        it.done = !it.done;
        const idx = l.items.indexOf(it);
        if (!it.indent) {
          // checking a main task checks its subtasks too
          for (let k = idx + 1; k < l.items.length && l.items[k].indent; k++) l.items[k].done = it.done;
        } else if (!it.done) {
          // unchecking a subtask reopens its main task
          for (let k = idx - 1; k >= 0; k--) if (!l.items[k].indent) { l.items[k].done = false; break; }
        }
        l.items.forEach(i => {
          const row = ul.querySelector(`.item[data-iid="${i.id}"]`);
          if (!row) return;
          row.classList.toggle("done", !!i.done);
          row.querySelector(".check").setAttribute("aria-checked", String(!!i.done));
        });
        updateTrash(card, l);
        scheduleSave(id);
        clearTimeout(sinkT);
        sinkT = setTimeout(() => {
          if (card.contains(document.activeElement) && document.activeElement.classList.contains("text")) return;
          const next = sortDone(l.items);
          if (next.every((x, i) => x === l.items[i])) return;
          animateReorder(card, l, () => { l.items = next; });
          layout();
          scheduleSave(id);
        }, 450);
        return;
      }
      const ind = e.target.closest(".indent");
      if (ind) {
        const it = itemOf(ind);
        const pos = caretOffset(ind.closest(".item").querySelector(".text"));
        setIndent(card, it, it.indent ? 0 : 1, pos);
      }
    });
    // keep focus in the text when pressing the indent helper
    ul.addEventListener("pointerdown", e => { if (e.target.closest(".indent")) e.preventDefault(); });



    ul.addEventListener("input", e => {
      const b = e.target.closest(".tbic .bic-text");
      if (b) { const it = itemOf(b); it.bic = b.textContent.replace(/\n/g, " "); scheduleSave(id, 700); return; }
      const t = e.target.closest(".text");
      if (!t) return;
      if (!t.textContent) t.textContent = "";
      if (!e.isComposing) capitalizeFirst(t);
      const it = itemOf(t);
      it.text = t.textContent.replace(/\n/g, " ");
      scheduleSave(id, 700);
      layout();
    });
    ul.addEventListener("paste", plainPaste);
    ul.addEventListener("compositionend", e => {
      const t = e.target.closest(".text");
      if (!t) return;
      capitalizeFirst(t);
      const it = itemOf(t);
      if (it) { it.text = t.textContent.replace(/\n/g, " "); scheduleSave(id, 700); }
    });

    ul.addEventListener("keydown", e => {
      const b = e.target.closest(".tbic .bic-text");
      if (b && (e.key === "Enter" || e.key === "Escape")) { e.preventDefault(); b.blur(); return; }
      const t = e.target.closest(".text");
      if (!t || e.isComposing) return;
      const l = L();
      const it = itemOf(t);
      const idx = l.items.indexOf(it);
      if (e.key === "Tab") {
        e.preventDefault();
        setIndent(card, it, e.shiftKey ? 0 : 1, caretOffset(t));
      } else if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const pos = caretOffset(t);
        const full = t.textContent;
        if (!full.trim() && it.indent) { setIndent(card, it, 0, 0); return; }
        it.text = full.slice(0, pos).replace(/\s+$/, "");
        const nu = { id: uid(), text: capText(full.slice(pos).replace(/^\s+/, "")), done: false, indent: it.indent };
        l.items.splice(idx + 1, 0, nu);
        renderItems(card, l);
        layout();
        scheduleSave(id);
        focusItem(card, nu.id, 0);
      } else if (e.key === "Backspace" && caretOffset(t) === 0 && getSelection().isCollapsed) {
        if (it.indent) { e.preventDefault(); setIndent(card, it, 0, 0); return; }
        if (idx === 0 && t.textContent) return;
        e.preventDefault();
        const prev = l.items[idx - 1];
        if (!prev) { if (!t.textContent) { l.items.splice(idx, 1); renderItems(card, l); layout(); scheduleSave(id); } return; }
        const join = prev.text.length;
        prev.text = prev.text + t.textContent;
        l.items.splice(idx, 1);
        renderItems(card, l);
        layout();
        scheduleSave(id);
        focusItem(card, prev.id, join);
      } else if (e.key === "ArrowUp" && caretOffset(t) === 0 && idx > 0) {
        e.preventDefault(); focusItem(card, l.items[idx - 1].id);
      } else if (e.key === "ArrowDown" && caretOffset(t) === t.textContent.length && idx < l.items.length - 1) {
        e.preventDefault(); focusItem(card, l.items[idx + 1].id, 0);
      } else if (e.key === "Escape") { t.blur(); }
    });
  }

  /* ---------- task dragging (within a card or to another card) ---------- */
  // A main task carries its subtasks. Drag by the grip (mouse, pen, finger) or press-and-hold a task on touch screens.
  let rd = null;
  function itemsWithout(l, ids) { return l.items.filter(i => !ids.includes(i.id)); }
  function toggleImportant(card, iid) {
    const l = lists.get(card.dataset.id);
    const it = l && l.items.find(i => i.id === iid);
    if (!it) return;
    it.important = !it.important;
    const row = card.querySelector(`.item[data-iid="${iid}"]`);
    if (row) {
      row.classList.toggle("important", it.important);
      row.classList.remove("imp-pulse"); void row.offsetWidth; row.classList.add("imp-pulse");
    }
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (err) {}
    if (it.important && !it.done) {
      // newly flagged: put it first (a main task with its subtasks; a subtask within its own group)
      const idx = l.items.indexOf(it);
      if (!it.indent) {
        let end = idx + 1;
        while (end < l.items.length && l.items[end].indent) end++;
        const block = l.items.splice(idx, end - idx);
        l.items.unshift(...block);
      } else {
        let p = idx - 1;
        while (p >= 0 && l.items[p].indent) p--;
        l.items.splice(idx, 1);
        l.items.splice(p + 1, 0, it);
      }
    }
    scheduleSave(l.id, 200);
    clearTimeout(impTimers.get(l.id));
    impTimers.set(l.id, setTimeout(() => {
      const c = cardEl(l.id);
      if (!c) return;
      const next = sortDone(l.items);
      const orderNow = [...c.querySelectorAll(".item")].map(r => r.dataset.iid);
      if (next.every((x, i) => x.id === orderNow[i]) ) { l.items = next; return; }
      animateReorder(c, l, () => { l.items = next; });
      layout();
      scheduleSave(l.id);
    }, 350));
  }
  const impTimers = new Map();
  const PRESS_MS = 450;
  function beginTaskDrag(card, li, x, y, t0) {
    const l = lists.get(card.dataset.id);
    const start = l.items.findIndex(i => i.id === li.dataset.iid);
    if (start < 0) return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    try { getSelection().removeAllRanges(); } catch (err) {}
    closePops();
    let end = start + 1;
    if (!l.items[start].indent) while (end < l.items.length && l.items[end].indent) end++;
    const blockIds = l.items.slice(start, end).map(i => i.id);
    const ul = card.querySelector(".items");
    const rows = blockIds.map(bid => ul.querySelector(`.item[data-iid="${bid}"]`));
    rows.forEach(r => r.classList.add("lifting"));
    const line = document.createElement("div");
    line.className = "drop-line";
    line.hidden = true;
    const prevZ = card.style.zIndex;
    card.style.zIndex = 99999;
    document.body.classList.add("item-drag");
    rd = { srcId: l.id, card, prevZ, blockIds, rows, line, top: !l.items[start].indent, sx: x, sy: y,
           pressId: li.dataset.iid, t0: t0 || Date.now(), maxMove: 0,
           scx: scrollX, scy: scrollY, x, y, target: null, raf: 0 };
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (err) {}
    autoScroll();
  }
  function autoScroll() {
    if (!rd) return;
    const edge = 70;
    let vy = 0;
    if (rd.y < edge) vy = -(edge - rd.y) / 4;
    else if (rd.y > innerHeight - edge) vy = (rd.y - (innerHeight - edge)) / 4;
    if (vy) { scrollBy(0, vy); moveTaskDrag(rd.x, rd.y); }
    rd.raf = requestAnimationFrame(autoScroll);
  }
  function moveTaskDrag(x, y) {
    if (!rd) return;
    rd.x = x; rd.y = y;
    rd.maxMove = Math.max(rd.maxMove, Math.hypot(x - rd.sx, y - rd.sy));
    const dx = x - rd.sx + (scrollX - rd.scx), dy = y - rd.sy + (scrollY - rd.scy);
    rd.rows.forEach(r => (r.style.transform = `translate(${dx}px, ${dy}px)`));
    // which card is under the pointer? (topmost first)
    const cards = [...board.querySelectorAll(".card")].sort((a, b) => (+b.style.zIndex || 0) - (+a.style.zIndex || 0));
    let over = null;
    for (const c of cards) {
      const r = c.getBoundingClientRect();
      if (x >= r.left - 10 && x <= r.right + 10 && y >= r.top - 10 && y <= r.bottom + 10) { over = c; break; }
    }
    board.querySelectorAll(".card.drop-target").forEach(c => c.classList.remove("drop-target"));
    if (!over) { rd.target = null; rd.line.hidden = true; return; }
    const tl = lists.get(over.dataset.id);
    const rest = itemsWithout(tl, rd.blockIds);
    const ul = over.querySelector(".items");
    if (tl.collapsed) {
      over.classList.add("drop-target");
      rd.target = { id: tl.id, slot: rest.length };
      rd.line.hidden = true;
      return;
    }
    if (rd.line.parentNode !== ul) ul.appendChild(rd.line);
    const ulTop = ul.getBoundingClientRect().top;
    let best = null, bestD = Infinity;
    for (let k = 0; k <= rest.length; k++) {
      if (rd.top && k < rest.length && rest[k].indent) continue; // don't split a task from its subtasks
      let sy;
      if (k < rest.length) sy = ul.querySelector(`.item[data-iid="${rest[k].id}"]`).getBoundingClientRect().top - 2;
      else if (rest.length) sy = ul.querySelector(`.item[data-iid="${rest[rest.length - 1].id}"]`).getBoundingClientRect().bottom + 2;
      else sy = ulTop + 2;
      const d = Math.abs(y - sy);
      if (d < bestD) { bestD = d; best = { k, sy }; }
    }
    if (over !== rd.card) over.classList.add("drop-target");
    rd.target = { id: tl.id, slot: best.k };
    const subLanding = !rd.top && best.k > 0;
    rd.line.hidden = false;
    rd.line.style.top = (best.sy - ulTop - 1.5) + "px";
    rd.line.style.left = subLanding ? "64px" : "20px";
  }
  function endTaskDrag(commit) {
    if (!rd) return false;
    const d = rd; rd = null;
    cancelAnimationFrame(d.raf);
    document.body.classList.remove("item-drag");
    d.line.remove();
    d.card.style.zIndex = d.prevZ;
    board.querySelectorAll(".card.drop-target").forEach(c => c.classList.remove("drop-target"));
    d.rows.forEach(r => { r.classList.remove("lifting"); r.style.transform = ""; });
    // Held still long enough without moving: toggle important instead of moving
    if (commit && d.maxMove < 8 && Date.now() - d.t0 >= PRESS_MS) { toggleImportant(d.card, d.pressId); return true; }
    if (!commit || !d.target) return true;
    const src = lists.get(d.srcId), tgt = lists.get(d.target.id);
    if (!src || !tgt) return true;
    const block = src.items.filter(i => d.blockIds.includes(i.id));
    if (tgt === src) {
      const rest = itemsWithout(src, d.blockIds);
      rest.splice(d.target.slot, 0, ...block);
      if (rest[0] && rest[0].indent) rest[0].indent = 0;
      if (rest.every((it, i) => it === src.items[i])) return true;
      src.items = rest;
    } else {
      src.items = itemsWithout(src, d.blockIds);
      if (src.items[0] && src.items[0].indent) src.items[0].indent = 0;
      tgt.items.splice(d.target.slot, 0, ...block);
      if (tgt.items[0] && tgt.items[0].indent) tgt.items[0].indent = 0;
      renderItems(cardEl(tgt.id), tgt);
      scheduleSave(tgt.id, 200);
    }
    renderItems(cardEl(src.id), src);
    layout();
    scheduleSave(src.id, 200);
    return true;
  }

  // Mouse / pen: press and hold still on a task to toggle important
  let mhold = null;
  board.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch" || e.button !== 0) return;
    const li = e.target.closest(".item");
    if (!li || e.target.closest(".check, .indent, .grip, .bic")) return;
    const card = li.closest(".card");
    mhold = { x: e.clientX, y: e.clientY, timer: setTimeout(() => {
      mhold = null;
      try { getSelection().removeAllRanges(); } catch (err) {}
      toggleImportant(card, li.dataset.iid);
    }, 550) };
  });
  const mholdCancel = () => { if (mhold) { clearTimeout(mhold.timer); mhold = null; } };
  window.addEventListener("pointermove", e => { if (mhold && Math.hypot(e.clientX - mhold.x, e.clientY - mhold.y) > 6) mholdCancel(); });
  window.addEventListener("pointerup", mholdCancel);
  window.addEventListener("pointercancel", mholdCancel);

  // Mouse / pen: grab the grip
  board.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch" || e.button !== 0) return;
    const grip = e.target.closest(".grip");
    if (!grip) return;
    e.preventDefault();
    e.stopPropagation();
    beginTaskDrag(grip.closest(".card"), grip.closest(".item"), e.clientX, e.clientY);
    const mv = ev => moveTaskDrag(ev.clientX, ev.clientY);
    const up = ev => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      endTaskDrag(ev.type === "pointerup");
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  });

  // Touch: grip starts right away; holding anywhere else on a task starts after a short press
  let hold = null;
  board.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const li = e.target.closest(".item");
    if (!li || e.target.closest(".check, .indent, .bic")) return;
    const card = li.closest(".card");
    if (e.target.closest(".grip")) {
      e.preventDefault();
      beginTaskDrag(card, li, t.clientX, t.clientY);
      return;
    }
    const t0 = Date.now();
    hold = { x: t.clientX, y: t.clientY, timer: setTimeout(() => { hold = null; beginTaskDrag(card, li, t.clientX, t.clientY, t0); }, 380) };
  }, { passive: false });
  document.addEventListener("touchmove", e => {
    const t = e.touches[0];
    if (hold && t && Math.hypot(t.clientX - hold.x, t.clientY - hold.y) > 8) { clearTimeout(hold.timer); hold = null; }
    if (rd && t) { e.preventDefault(); moveTaskDrag(t.clientX, t.clientY); }
  }, { passive: false });
  const touchEnd = e => {
    if (hold) { clearTimeout(hold.timer); hold = null; }
    if (rd) { e.preventDefault(); endTaskDrag(e.type === "touchend"); }
  };
  document.addEventListener("touchend", touchEnd, { passive: false });
  document.addEventListener("touchcancel", touchEnd, { passive: false });
  board.addEventListener("contextmenu", e => { if (rd || hold) e.preventDefault(); });

  // Tasks always start with a capital letter
  const capText = str => str.replace(/^(\s*)(\p{Ll})/u, (m, sp, ch) => sp + ch.toUpperCase());
  function capitalizeFirst(el) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const i = node.data.search(/\S/);
      if (i < 0) continue;
      const ch = node.data[i];
      const up = ch.toUpperCase();
      if (ch === up || !/\p{Ll}/u.test(ch)) return;
      const pos = caretOffset(el);
      node.data = node.data.slice(0, i) + up + node.data.slice(i + 1);
      if (document.activeElement === el) setCaret(el, pos);
      return;
    }
  }

  function setIndent(card, it, level, pos) {
    if (it.indent === level) { focusItem(card, it.id, pos); return; }
    it.indent = level;
    const l = lists.get(card.dataset.id);
    renderItems(card, l);
    scheduleSave(l.id);
    focusItem(card, it.id, pos);
  }

  function plainPaste(e) {
    e.preventDefault();
    const txt = (e.clipboardData || window.clipboardData).getData("text/plain").replace(/\s*\n\s*/g, " ");
    document.execCommand("insertText", false, txt);
  }

  /* ---------- popover ---------- */
  function closePops() { board.querySelectorAll(".pop").forEach(p => p.remove()); }
  function openPop(card) {
    const id = card.dataset.id;
    const l = lists.get(id);
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.innerHTML = `
      <div class="pop-label">Title color</div>
      <div class="swatches">${COLORS.map(c => `<button class="sw" style="background:${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="${c.toLowerCase() === (l.color || "").toLowerCase()}"></button>`).join("")}</div>
      <label class="custom"><input type="color" id="custom-${id}" value="${/^#[0-9a-f]{6}$/i.test(l.color) ? l.color : "#ffffff"}">Custom color</label>
      <hr>
      <div class="del-row"><button class="del">Delete list</button></div>`;
    card.appendChild(pop);
    const apply = c => {
      l.color = c;
      card.querySelector(".card-head").style.color = c;
      card.style.setProperty("--list-color", c);
      pop.querySelectorAll(".sw").forEach(s => s.setAttribute("aria-pressed", String(s.dataset.c === c)));
      scheduleSave(id, 400);
    };
    pop.addEventListener("click", e => {
      e.stopPropagation();
      const sw = e.target.closest(".sw");
      if (sw) apply(sw.dataset.c);
      if (e.target.closest(".del")) {
        pop.querySelector(".del-row").innerHTML = `<div class="confirm">Delete this list? <button class="yes">Delete</button><button class="no">Keep</button></div>`;
      }
      if (e.target.closest(".yes")) {
        lists.delete(id);
        card.remove();
        renderEmpty();
        layout();
        scheduleSave(id, 0);
      }
      if (e.target.closest(".no")) closePops();
    });
    pop.querySelector('input[type="color"]').addEventListener("input", e => apply(e.target.value));
    pop.addEventListener("pointerdown", e => e.stopPropagation());
  }
  document.addEventListener("pointerdown", e => { if (!e.target.closest(".pop") && !e.target.closest(".color-btn")) closePops(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePops(); });

  /* ================= IDEAS & NOTES ================= */
  const ideaBoard = document.getElementById("ideaBoard");
  const ideas = new Map();
  const ipending = new Set(), itimers = new Map(), ichains = new Map();
  const ILS_KEY = "task-canvas-ideas-v1", TLS_KEY = "task-canvas-tags-v1";
  const UNTAGGED = "#C7C7CC";
  // Built-in tags. Keywords drive the "Suggested" tags.
  const PRESET_TAGS = [
    { name: "Idea", color: "#FFD84D", words: ["idea", "what if", "could we", "maybe", "concept", "invent", "imagine", "brainstorm", "wouldn't it", "someday"] },
    { name: "Note", color: "#F2F2F2", words: ["note", "remember", "fyi", "reminder", "don't forget", "jot"] },
    { name: "Business", color: "#5AA9FF", words: ["business", "client", "customer", "revenue", "sales", "sell", "marketing", "company", "pitch", "profit", "startup", "invoice", "pricing", "brand", "market"] },
    { name: "Project", color: "#FFA24C", words: ["project", "build", "feature", "app", "design", "prototype", "launch", "milestone", "deadline", "version", "roadmap", "website"] },
    { name: "Personal", color: "#FF7EB6", words: ["family", "personal", "birthday", "home", "kids", "wife", "husband", "friend", "vacation", "trip", "house", "anniversary", "mom", "dad"] },
    { name: "Meeting", color: "#8C9EFF", words: ["meeting", "call", "agenda", "discussed", "action items", "follow up", "follow-up", "attendees", "zoom", "notes from"] },
    { name: "Research", color: "#4FD1C5", words: ["research", "look into", "find out", "learn", "how does", "how do", "why does", "study", "article", "read about", "compare", "investigate"] },
    { name: "Health", color: "#5FD68A", words: ["health", "workout", "exercise", "doctor", "diet", "sleep", "gym", "run", "walk", "weight", "meditat", "vitamin", "appointment"] },
    { name: "Shopping", color: "#FF6B6B", words: ["buy", "order", "purchase", "store", "amazon", "price", "gift", "shop", "cost", "$"] },
    { name: "Quote", color: "#B18CFF", words: ["quote", "said", "“", "\"", "once told", "saying"] }
  ];
  let customTags = [];
  const allTags = () => [...PRESET_TAGS, ...customTags];
  const tagByName = n => allTags().find(t => t.name.toLowerCase() === String(n || "").toLowerCase());

  function suggestTags(text) {
    const t = " " + (text || "").toLowerCase() + " ";
    if (!t.trim()) return [];
    const scored = allTags().map(tag => {
      const words = tag.words || [tag.name.toLowerCase()];
      let score = 0;
      words.forEach(w => {
        if (w.length <= 2 && /\W/.test(w)) { if (t.includes(w)) score += 1; return; }
        const re = new RegExp("(^|[^a-z])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
        const m = t.match(re);
        if (m) score += m.length * (w.includes(" ") ? 2 : 1);
      });
      return { tag, score };
    }).filter(s => s.score > 0).sort((a, b) => b.score - a.score);
    return scored.slice(0, 3).map(s => s.tag);
  }

  function iSaveLocal() {

  function wireIdea(card) {
    const id = card.dataset.id;
    const N = () => ideas.get(id);

    head.addEventListener("pointerdown", e => {
      if (e.button !== 0 || e.target.closest("button")) return;
      const onTag = !!e.target.closest(".tag-btn");
      if (isPhone()) return;
      e.preventDefault();
      const n = N();
      drag = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y, moved: false, onTag };
      head.setPointerCapture(e.pointerId);
    });
    head.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== drag.pid) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) < 5) return;
      const n = N();
      if (!drag.moved) {
        drag.moved = true;
        card.classList.add("dragging");
        n.z = ideaTopZ(); card.style.zIndex = n.z;
        closeTagPops();
        if (document.activeElement && card.contains(document.activeElement)) document.activeElement.blur();

  function startIdeaSync() {
    let first = true;
    db.collection("ideas").onSnapshot(snap => {
      if (first) {
        first = false;
        const remote = new Set(snap.docs.map(d => d.id));
        if (snap.empty && ideas.size) { ideas.forEach((_, id) => { ipending.add(id); iFlush(id); }); return; }
        [...ideas.keys()].forEach(id => { if (!remote.has(id) && !ipending.has(id)) { ideas.delete(id); const c = ideaEl(id); if (c) c.remove(); } });
      }
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        if (ipending.has(id) || ch.doc.metadata.hasPendingWrites) return;
        if (ch.type === "removed") { ideas.delete(id); const c = ideaEl(id); if (c) c.remove(); return; }
        const data = ch.doc.data();
        if (!data) return;
        const incoming = { ...data, id };
        const cur = ideas.get(id);
        if (cur && JSON.stringify(iclean(cur)) === JSON.stringify(iclean(incoming))) return;
        const card = ideaEl(id);
        if (card && card.contains(document.activeElement)) return;
        ideas.set(id, incoming);
        renderIdea(id);
      });
      renderIdeaEmpty(); ideaLayout(); iSaveLocal();
    }, () => {});

      if (!s.exists) { if (customTags.length) saveTags(); return; }
      const d = s.data();
      if (d && Array.isArray(d.custom)) { customTags = d.custom.map(t => ({ ...t })); iSaveLocal(); ideas.forEach((_, id) => { const c = ideaEl(id); if (c && !c.contains(document.activeElement)) renderIdea(id); }); }

  /* ================= SCHEDULE (critical path) ================= */

  const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  const isoToday = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const parseISO = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? { y: +m[1], m: +m[2] - 1, d: +m[3] } : null; };
  const shortDate = iso => { const p = parseISO(iso); return p ? MONTHS[p.m] + " " + p.d : ""; };
  const longDate = iso => { const p = parseISO(iso); return p ? MONTH_NAMES[p.m] + " " + p.d + ", " + p.y : ""; };

  function sSaveLocal() { try { localStorage.setItem(SLS_KEY, JSON.stringify([...scheds.values()])); } catch (e) {} }
  function sLoadLocal() { try { const a = JSON.parse(localStorage.getItem(SLS_KEY) || "[]"); if (Array.isArray(a)) a.forEach(s => scheds.set(s.id, s)); } catch (e) {} }
  const sclean = s => ({ id: s.id, m: typeof s.m === "number" ? s.m : null, title: s.title, color: s.color, x: Math.round(s.x), y: Math.round(s.y), z: s.z || 1, collapsed: !!s.collapsed, created: s.created,

  function updateSchedMeta(card, s) {

  }
