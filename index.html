  function newSched() {
    const id = uid();
    const spot = schedFreeSpot();
    const used = [...scheds.values()].map(s => s.color);
    const color = COLORS.find(c => !used.includes(c) && c !== "#F2F2F2") || COLORS[scheds.size % COLORS.length];
    scheds.set(id, { id, title: "NEW SCHEDULE", color, x: spot.x, y: spot.y, z: schedTopZ(), m: nextM(), collapsed: false, created: Date.now(), rows: [] });
    renderSchedEmpty(); renderSched(id); schedLayout();
    sScheduleSave(id, 50);
    const card = schedEl(id);
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    schedEditTitle(card, true);
  }

  function schedEditTitle(card, selectAll) {
    const t = card.querySelector(".title");
    t.setAttribute("contenteditable", "true");
    t.focus();
    const sel = getSelection(), r = document.createRange();
    r.selectNodeContents(t); if (!selectAll) r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
  }
  function schedCommitTitle(card) {
    const t = card.querySelector(".title");
    if (t.getAttribute("contenteditable") !== "true") return;
    t.setAttribute("contenteditable", "false");
    const s = scheds.get(card.dataset.id); if (!s) return;
    const v = t.textContent.replace(/\s+/g, " ").trim().toUpperCase() || "UNTITLED";
    t.textContent = v;
    if (v !== s.title) { s.title = v; sScheduleSave(s.id); }
  }

  /* ----- popovers: color/options, status, calendar ----- */
  function closeSchedPops() { schedBoard.querySelectorAll(".pop").forEach(p => p.remove()); }
  document.addEventListener("pointerdown", e => { if (!e.target.closest(".sched-card .pop") && !e.target.closest(".sched-card .color-btn, .date-pill, .status-pill")) closeSchedPops(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSchedPops(); });
  function placePop(card, pop, anchor) {
    const cr = card.getBoundingClientRect(), ar = anchor.getBoundingClientRect();
    pop.style.top = (ar.bottom - cr.top + 6) + "px";
    let left = ar.left - cr.left;
    left = Math.max(8, Math.min(left, card.clientWidth - pop.offsetWidth - 8));
    pop.style.left = left + "px"; pop.style.right = "auto";
  }

  function openSchedOptions(card) {
    closeSchedPops();
    const id = card.dataset.id, s = scheds.get(id);
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.innerHTML = `
      <div class="pop-label">Title color</div>
      <div class="swatches">${COLORS.map(c => `<button class="sw" style="background:${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="${c.toLowerCase() === (s.color || "").toLowerCase()}"></button>`).join("")}</div>
      <label class="custom"><input type="color" id="scolor-${id}" value="${/^#[0-9a-f]{6}$/i.test(s.color) ? s.color : "#ffffff"}">Custom color</label>
      <hr>
      <button class="pop-action sort-date">Sort milestones by date</button>
      <hr>
      <div class="del-row"><button class="del">Delete schedule</button></div>`;
    card.appendChild(pop);
    const apply = c => {
      s.color = c;
      card.querySelector(".card-head").style.color = c;
      card.style.setProperty("--list-color", c);
      pop.querySelectorAll(".sw").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.c === c)));
      sScheduleSave(id, 400);
    };
    pop.addEventListener("pointerdown", e => e.stopPropagation());
    pop.addEventListener("click", e => {
      e.stopPropagation();
      const sw = e.target.closest(".sw");
      if (sw) apply(sw.dataset.c);
      if (e.target.closest(".sort-date")) {
        s.rows = [...s.rows.filter(r => r.date).sort((a, b) => a.date.localeCompare(b.date)), ...s.rows.filter(r => !r.date)];
        renderSchedRows(card, s); schedLayout(); sScheduleSave(id, 200); closeSchedPops();
      }
      if (e.target.closest(".del")) pop.querySelector(".del-row").innerHTML = `<div class="confirm">Delete this schedule? <button class="yes">Delete</button><button class="no">Keep</button></div>`;
      if (e.target.closest(".yes")) {
        const snapshot = JSON.parse(JSON.stringify(s));
        scheds.delete(id); card.remove(); renderSchedEmpty(); schedLayout(); sScheduleSave(id, 0);
        showUndo("Deleted schedule", () => { scheds.set(id, snapshot); renderSchedEmpty(); renderSched(id); schedLayout(); sScheduleSave(id, 0); });
      }
      if (e.target.closest(".no")) closeSchedPops();
    });
    pop.querySelector('input[type="color"]').addEventListener("input", e => apply(e.target.value));
  }

  function openStatusMenu(card, r, anchor) {
    closeSchedPops();
    const pop = document.createElement("div");
    pop.className = "pop status-pop";
    pop.innerHTML = STATUSES.map(st => `<button class="status-opt ${STATUS_CLASS[st]}" data-s="${st}" aria-pressed="${r.status === st}"><span class="s-dot"></span>${st}</button>`).join("");
    card.appendChild(pop);
    placePop(card, pop, anchor);
    pop.addEventListener("pointerdown", e => e.stopPropagation());
    pop.addEventListener("click", e => {
      const o = e.target.closest(".status-opt");
      if (o) { setStatus(card, r, o.dataset.s); closeSchedPops(); }
    });
  }

  function openCalendar(card, r, anchor) {
    closeSchedPops();
    const base = parseISO(r.date) || parseISO(isoToday());
    let vy = base.y, vm = base.m;
    const pop = document.createElement("div");
    pop.className = "pop cal-pop";
    card.appendChild(pop);
    const draw = () => {
      const first = new Date(vy, vm, 1).getDay();
      const days = new Date(vy, vm + 1, 0).getDate();
      const today = isoToday();
      let cells = "";
      for (let i = 0; i < first; i++) cells += `<span></span>`;
      for (let d = 1; d <= days; d++) {
        const iso = vy + "-" + String(vm + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        cells += `<button class="cal-day${iso === r.date ? " sel" : ""}${iso === today ? " today" : ""}" data-iso="${iso}" aria-label="${longDate(iso)}">${d}</button>`;
      }
      pop.innerHTML = `
        <div class="cal-head"><button class="cal-nav" data-d="-1" aria-label="Previous month">‹</button><span class="cal-title">${MONTH_NAMES[vm]} ${vy}</span><button class="cal-nav" data-d="1" aria-label="Next month">›</button></div>
        <div class="cal-grid cal-dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-foot"><button class="cal-today">Today</button>${r.date ? `<button class="cal-clear">Clear date</button>` : ""}</div>`;
    };
    draw();
    placePop(card, pop, anchor);
    pop.addEventListener("pointerdown", e => e.stopPropagation());
    pop.addEventListener("click", e => {
      e.stopPropagation();
      const nav = e.target.closest(".cal-nav");
      if (nav) { vm += +nav.dataset.d; if (vm < 0) { vm = 11; vy--; } if (vm > 11) { vm = 0; vy++; } draw(); return; }
      const day = e.target.closest(".cal-day");
      const pick = iso => { r.date = iso; refreshRow(card, r); sScheduleSave(card.dataset.id, 300); closeSchedPops(); };
      if (day) pick(day.dataset.iso);
      if (e.target.closest(".cal-today")) pick(isoToday());
      if (e.target.closest(".cal-clear")) pick(null);
    });
  }

  function wireSched(card) {
    const id = card.dataset.id;
    const S = () => scheds.get(id);
    const head = card.querySelector(".card-head");
    const title = card.querySelector(".title");
    const ul = card.querySelector(".srows");
    const rowOf = el => { const li = el.closest(".srow"); return li ? S().rows.find(r => r.id === li.dataset.rid) : null; };

    // drag card by header (computer / iPad); tap title to rename
    let drag = null;
    head.addEventListener("pointerdown", e => {
      if (e.button !== 0 || e.target.closest("button") || title.getAttribute("contenteditable") === "true" || isPhone()) return;
      e.preventDefault();
      const s = S();
      drag = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, ox: s.x, oy: s.y, moved: false, onTitle: !!e.target.closest(".title") };
      head.setPointerCapture(e.pointerId);
    });
    head.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== drag.pid) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) < 5) return;
      const s = S();
      if (!drag.moved) { drag.moved = true; card.classList.add("dragging"); s.z = schedTopZ(); card.style.zIndex = s.z; closeSchedPops(); if (document.activeElement && card.contains(document.activeElement)) document.activeElement.blur(); }
      s.x = Math.max(0, drag.ox + dx); s.y = Math.max(0, drag.oy + dy);
      card.style.left = s.x + "px"; card.style.top = s.y + "px";
    });
    const endDrag = e => {
      if (!drag || e.pointerId !== drag.pid) return;
      const d = drag; drag = null;
      card.classList.remove("dragging");
      if (d.moved) { sScheduleSave(id, 200); schedLayout(); }
      else if (d.onTitle && e.type === "pointerup") schedEditTitle(card, false);
    };
    head.addEventListener("pointerup", endDrag);
    head.addEventListener("pointercancel", endDrag);
    title.addEventListener("click", () => { if (isPhone() && title.getAttribute("contenteditable") !== "true") schedEditTitle(card, false); });
    title.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault(); schedCommitTitle(card);
        const s = S();
        if (s.collapsed) return;
        if (!s.rows.length) { s.rows.push(newRow()); renderSchedRows(card, s); sScheduleSave(id); schedLayout(); }
        focusMs(card, s.rows[0].id);
      } else if (e.key === "Escape") title.blur();
    });
    title.addEventListener("blur", () => schedCommitTitle(card));
    title.addEventListener("paste", plainPaste);

    card.querySelector(".toggle").addEventListener("click", () => { const s = S(); s.collapsed = !s.collapsed; renderSched(id); schedLayout(); sScheduleSave(id, 200); });
    card.querySelector(".color-btn").addEventListener("click", e => { e.stopPropagation(); if (card.querySelector(".pop:not(.status-pop):not(.cal-pop)")) closeSchedPops(); else openSchedOptions(card); });
    card.querySelector(".add-ms").addEventListener("click", () => {
      const s = S();
      const last = s.rows[s.rows.length - 1];
      if (last && !last.text.trim() && !last.date && !last.bic) { focusMs(card, last.id); return; }
      const r = newRow(); s.rows.push(r);
      renderSchedRows(card, s); schedLayout(); sScheduleSave(id); focusMs(card, r.id);
    });

    ul.addEventListener("click", e => {
      const chk = e.target.closest(".check");
      if (chk) { const r = rowOf(chk); setStatus(card, r, r.status === "Done" ? (r.prev && r.prev !== "Done" ? r.prev : "Not Started") : "Done"); return; }
      const dp = e.target.closest(".date-pill");
      if (dp) { e.stopPropagation(); if (card.querySelector(".cal-pop")) { closeSchedPops(); return; } openCalendar(card, rowOf(dp), dp); return; }
      const sp = e.target.closest(".status-pill");
      if (sp) { e.stopPropagation(); if (card.querySelector(".status-pop")) { closeSchedPops(); return; } openStatusMenu(card, rowOf(sp), sp); }
    });
    ul.addEventListener("input", e => {
      const ms = e.target.closest(".ms-text"), bic = e.target.closest(".bic-text");
      if (!ms && !bic) return;
      const r = rowOf(e.target);
      if (ms) { if (!e.isComposing) capitalizeFirst(ms); r.text = ms.textContent.replace(/\n/g, " "); }
      else r.bic = bic.textContent.replace(/\n/g, " ");
      sScheduleSave(id, 700);
      updateSchedMeta(card, S());
      schedLayout();
    });
    ul.addEventListener("paste", plainPaste);
    ul.addEventListener("keydown", e => {
      const ms = e.target.closest(".ms-text"), bic = e.target.closest(".bic-text");
      if ((!ms && !bic) || e.isComposing) return;
      const s = S(), r = rowOf(e.target), idx = s.rows.indexOf(r);
      if (e.key === "Enter") {
        e.preventDefault();
        if (bic) { bic.blur(); return; }
        const nr = newRow();
        s.rows.splice(idx + 1, 0, nr);
        renderSchedRows(card, s); schedLayout(); sScheduleSave(id); focusMs(card, nr.id);
      } else if (e.key === "Backspace" && ms && !ms.textContent && !r.date && !r.bic) {
        e.preventDefault();
        s.rows.splice(idx, 1);
        renderSchedRows(card, s); schedLayout(); sScheduleSave(id);
        if (s.rows[idx - 1]) focusMs(card, s.rows[idx - 1].id);
      } else if (e.key === "Escape") e.target.blur();
    });

    // reorder milestones by dragging the grip
    let ro = null;
    ul.addEventListener("pointerdown", e => {
      const grip = e.target.closest(".grip");
      if (!grip || e.button !== 0) return;
      e.preventDefault();
      if (document.activeElement && card.contains(document.activeElement)) document.activeElement.blur();
      const li = grip.closest(".srow");
      const line = document.createElement("div"); line.className = "drop-line"; line.hidden = true; ul.appendChild(line);
      li.classList.add("lifting");
      ro = { pid: e.pointerId, li, rid: li.dataset.rid, sy: e.clientY, line, slot: null };
      ul.setPointerCapture(e.pointerId);
    });
    ul.addEventListener("pointermove", e => {
      if (!ro || e.pointerId !== ro.pid) return;
      ro.li.style.transform = `translateY(${e.clientY - ro.sy}px)`;
      const rest = [...ul.querySelectorAll(".srow")].filter(x => x !== ro.li);
      const ulTop = ul.getBoundingClientRect().top;
      let best = null, bd = Infinity;
      for (let k = 0; k <= rest.length; k++) {
        const y = k < rest.length ? rest[k].getBoundingClientRect().top - 2 : (rest.length ? rest[rest.length - 1].getBoundingClientRect().bottom + 2 : ulTop);
        const d = Math.abs(e.clientY - y);
        if (d < bd) { bd = d; best = { k, y }; }
      }
      ro.slot = best.k;
      ro.line.hidden = false; ro.line.style.top = (best.y - ulTop - 1.5) + "px"; ro.line.style.left = "20px";
    });
    const endRo = e => {
      if (!ro || e.pointerId !== ro.pid) return;
      const d = ro; ro = null;
      d.line.remove(); d.li.classList.remove("lifting"); d.li.style.transform = "";
      if (e.type !== "pointerup" || d.slot == null) return;
      const s = S();
      const r = s.rows.find(x => x.id === d.rid);
      const rest = s.rows.filter(x => x !== r);
      rest.splice(d.slot, 0, r);
      if (rest.every((x, i) => x === s.rows[i])) return;
      s.rows = rest; renderSchedRows(card, s); sScheduleSave(id, 200);
    };
    ul.addEventListener("pointerup", endRo);
    ul.addEventListener("pointercancel", endRo);
  }
  function focusMs(card, rid) { const t = card.querySelector(`.srow[data-rid="${rid}"] .ms-text`); if (t) setCaret(t, t.textContent.length); }

  function renderAllScheds() {
    const ids = new Set(scheds.keys());
    schedBoard.querySelectorAll(".card").forEach(c => { if (!ids.has(c.dataset.id)) c.remove(); });
    scheds.forEach((_, id) => renderSched(id));
    renderSchedEmpty(); schedLayout();
  }
  function startSchedSync() {
    let first = true;
    db.collection("schedules").onSnapshot(snap => {
      if (first) {
        first = false;
        const remote = new Set(snap.docs.map(d => d.id));
        if (snap.empty && scheds.size) { scheds.forEach((_, id) => { spending.add(id); sFlush(id); }); return; }
        [...scheds.keys()].forEach(id => { if (!remote.has(id) && !spending.has(id)) { scheds.delete(id); const c = schedEl(id); if (c) c.remove(); } });
      }
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        if (spending.has(id) || ch.doc.metadata.hasPendingWrites) return;
        if (ch.type === "removed") { scheds.delete(id); const c = schedEl(id); if (c) c.remove(); return; }
        const data = ch.doc.data();
        if (!data || !Array.isArray(data.rows)) return;
        const incoming = { ...data, id, rows: data.rows.map(r => ({ ...r })) };
        const cur = scheds.get(id);
        if (cur && JSON.stringify(sclean(cur)) === JSON.stringify(sclean(incoming))) return;
        const c = schedEl(id);
        if (c && (c.contains(document.activeElement) || c.querySelector(".pop"))) return;
        scheds.set(id, incoming); renderSched(id);
      });
      renderSchedEmpty(); schedLayout(); sSaveLocal();
    }, () => {});
  }


  /* ---------- boot ---------- */


  /* ---------- + menu: choose a card type ---------- */
  const addBtn = document.getElementById("addMenuBtn"), addMenu = document.getElementById("addMenu");
  const setMenu = open => { addMenu.hidden = !open; addBtn.setAttribute("aria-expanded", String(open)); addBtn.classList.toggle("open", open); };
  addBtn.addEventListener("click", e => { e.stopPropagation(); setMenu(addMenu.hidden); if (!addMenu.hidden) addMenu.querySelector("button").focus(); });
  addMenu.addEventListener("click", e => {
    const b = e.target.closest("button[data-kind]");
    if (!b) return;
    setMenu(false);
    closePops(); closeTagPops(); closeSchedPops();
    ({ task: addList, sched: newSched, note: newIdea, tidy: tidyUp })[b.dataset.kind]();
  });
  addMenu.addEventListener("keydown", e => {
    const items = [...addMenu.querySelectorAll("button")], i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); items[(i + items.length - 1) % items.length].focus(); }
  });
  document.addEventListener("pointerdown", e => { if (!addMenu.hidden && !e.target.closest(".add-wrap")) setMenu(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !addMenu.hidden) { setMenu(false); addBtn.focus(); } });

  document.getElementById("toastUndo").addEventListener("click", () => {
    const fn = undoState; undoState = null;
    document.getElementById("toast").hidden = true;
    if (fn) fn();
  });
  phoneMQ.addEventListener("change", () => schedLayout());
  window.addEventListener("resize", () => schedLayout());

  loadLocal();
  renderAll();
  iLoadLocal();
  renderAllIdeas();
  sLoadLocal();
  renderAllScheds();

  (async () => {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    if (!db) return;
    startIdeaSync();
    startSchedSync();
    let first = true;
    db.collection("lists").onSnapshot(snap => {
      if (first) {
        first = false;
        const remote = new Set(snap.docs.map(d => d.id));
        if (snap.empty && lists.size) { lists.forEach((_, id) => { pending.add(id); flush(id); }); return; }
        // anything only on this device from before sync: drop in favor of the saved copy
        [...lists.keys()].forEach(id => { if (!remote.has(id) && !pending.has(id)) { lists.delete(id); const c = cardEl(id); if (c) c.remove(); } });
      }
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        if (pending.has(id) || ch.doc.metadata.hasPendingWrites) return;
        if (ch.type === "removed") { lists.delete(id); const c = cardEl(id); if (c) c.remove(); return; }
        const data = ch.doc.data();
        if (!data || !Array.isArray(data.items)) return;
        const incoming = { ...data, id, items: data.items.map(i => ({ ...i })) };
        const cur = lists.get(id);
        if (cur && JSON.stringify(clean(cur)) === JSON.stringify(clean(incoming))) return;
        const card = cardEl(id);
        if (card && card.contains(document.activeElement)) return; // don't disturb typing
        lists.set(id, incoming);
        renderCard(id);
      });
      renderEmpty();
      layout();
      saveLocal();
    }, () => showStatus("Sync paused. Changes are kept on this device."));
  })();
})();
</script>
</body>
</html>
