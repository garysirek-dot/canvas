  const searchBtn = document.getElementById("searchBtn"), searchBox = document.getElementById("searchBox"),
        searchInput = document.getElementById("searchInput"), searchCount = document.getElementById("searchCount");
  const searchTerms = () => search.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hasAll = (text, terms) => { const t = text.toLowerCase(); return terms.every(w => t.includes(w)); };
  function searchFilterActive() { return search.open && searchTerms().length > 0 && search.mode === "filter"; }

  // what each card offers to search: its title plus every line (with the element that shows it)
  function searchUnits() {
    const out = [];
    lists.forEach(l => {
      const el = cardEl(l.id); if (!el) return;
      const rows = l.items.map(it => {
        let text = (it.text || "") + " " + (it.bic || "") + " " + (it.ref ? "" : (it.done ? "Done" : (it.status || "Not Started")));
        if (it.ref) { const src = lists.get(it.ref.l); const si = src && src.items.find(i => i.id === it.ref.i); text = (src ? src.title : (it.srcTitle || "")) + " " + (si ? si.text + " " + (si.bic || "") : it.text); }
        return { text, el: el.querySelector(`.item[data-iid="${it.id}"]`) };
      });
      out.push({ el, title: l.title || "", rows });
    });
    ideas.forEach(n => {
      const el = ideaEl(n.id); if (!el) return;
      out.push({ el, title: (n.title || "") + " " + (n.tags || []).join(" "), rows: [{ text: n.text || "", el: el.querySelector(".idea-text") }] });
    });
    scheds.forEach(s => {
      const el = schedEl(s.id); if (!el) return;
      out.push({ el, title: s.title || "", rows: s.rows.map(r => ({ text: [r.text, r.bic, r.date ? shortDate(r.date) + " " + longDate(r.date) : "", r.status].join(" "), el: el.querySelector(`.srow[data-rid="${r.id}"]`) })) });
    });
    return out;
  }

  function applySearch() {
    const terms = search.open ? searchTerms() : [];
    const on = terms.length > 0;
    document.body.classList.toggle("searching", on);
    document.body.classList.toggle("search-filter", on && search.mode === "filter");
    document.body.classList.toggle("search-highlight", on && search.mode === "highlight");
    document.querySelectorAll(".row-hit").forEach(e => e.classList.remove("row-hit"));
    let hits = 0;
    searchUnits().forEach(u => {
      if (!on) { u.el.classList.remove("search-hit", "search-miss"); return; }
      const titleHit = hasAll(u.title, terms);
      let rowHit = false;
      u.rows.forEach(r => { if (hasAll(r.text, terms) || hasAll(u.title + " " + r.text, terms) && !titleHit) { rowHit = true; if (r.el) r.el.classList.add("row-hit"); } });
      const all = hasAll([u.title, ...u.rows.map(r => r.text)].join(" "), terms);
      const hit = titleHit || rowHit || all;
      u.el.classList.toggle("search-hit", hit);
      u.el.classList.toggle("search-miss", !hit);
      if (hit) hits++;
    });
    searchCount.textContent = on ? (hits === 1 ? "1 card" : hits + " cards") : "";
    if (!on) restorePositions();
    arrange();
  }
  // "Only matches" on a computer: line the matching cards up neatly without moving where they really live
  function layoutSearchResults() {
    const cards = allCards().filter(c => c.el && c.el.classList.contains("search-hit")).sort((a, b) => (colOf(a.o.x) - colOf(b.o.x)) || (a.o.y - b.o.y));
    const cols = Math.max(1, Math.floor((viewW() + GAP) / COL_STEP));
    const heights = Array(cols).fill(TOP_Y);
    let w = 0;
    cards.forEach(c => {
      const col = heights.indexOf(Math.min(...heights));
      c.el.style.left = col * COL_STEP + "px";
      c.el.style.top = heights[col] + "px";
      heights[col] += c.el.offsetHeight + GAP;
      w = Math.max(w, col * COL_STEP + c.w);
    });
    canvasEl.style.width = Math.max(w + 40, viewW()) + "px";
    canvasEl.style.height = (Math.max(...heights) + 120) + "px";
  }
  function restorePositions() { allCards().forEach(c => { if (c.el) { c.el.style.left = c.o.x + "px"; c.el.style.top = c.o.y + "px"; } }); }

  function openSearch() {
    search.open = true;
    searchBox.hidden = false;
    document.body.classList.add("search-open");
    searchBtn.setAttribute("aria-expanded", "true");
    searchInput.focus();
    applySearch();
  }
  function closeSearch() {
    search.open = false; search.q = ""; searchInput.value = "";
    searchBox.hidden = true;
    document.body.classList.remove("search-open");
    searchBtn.setAttribute("aria-expanded", "false");
    applySearch();
  }
  function setMode(m) {
    search.mode = m;
    try { localStorage.setItem("canvas-search-mode", m); } catch (e) {}
    document.querySelectorAll(".search-mode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
    applySearch();
  }
  searchBtn.addEventListener("click", () => (search.open ? closeSearch() : openSearch()));
  document.getElementById("searchClose").addEventListener("click", closeSearch);
  let searchT;
  searchInput.addEventListener("input", () => { search.q = searchInput.value; clearTimeout(searchT); searchT = setTimeout(applySearch, 120); });
  searchInput.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); closeSearch(); searchBtn.focus(); } });
  document.querySelectorAll(".search-mode button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  setMode(search.mode);
  // keep results current while you edit cards
  let reSearchT;
  document.addEventListener("input", e => { if (!search.open || e.target === searchInput) return; clearTimeout(reSearchT); reSearchT = setTimeout(applySearch, 400); });
  document.addEventListener("click", e => { if (!search.open || e.target.closest(".search-wrap")) return; clearTimeout(reSearchT); reSearchT = setTimeout(applySearch, 400); });
  // while only matches are showing, cards stay put (moving them would be confusing)
  canvasEl.addEventListener("pointerdown", e => {
    if (!document.body.classList.contains("search-filter")) return;
    if (e.target.closest(".card-head, .card-grip") && !e.target.closest("button")) { e.stopPropagation(); showStatus("Cards can't be moved while searching. Close search to rearrange."); }
  }, true);

  /* ---------- + menu: choose a card type ---------- */
  const addBtn = document.getElementById("addMenuBtn"), addMenu = document.getElementById("addMenu");
  const setMenu = open => { addMenu.hidden = !open; addBtn.setAttribute("aria-expanded", String(open)); addBtn.classList.toggle("open", open); };
  addBtn.addEventListener("click", e => { e.stopPropagation(); setMenu(addMenu.hidden); if (!addMenu.hidden) addMenu.querySelector("button").focus(); });
  addMenu.addEventListener("click", e => {
    const b = e.target.closest("button[data-kind]");
    if (!b) return;
    setMenu(false);
    closePops(); closeTagPops(); closeSchedPops();
    ({ task: addList, sched: newSched, note: newIdea, tidy: tidyUp })[b.dataset.kind]();
  });
  addMenu.addEventListener("keydown", e => {
    const items = [...addMenu.querySelectorAll("button")], i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); items[(i + items.length - 1) % items.length].focus(); }
  });
  document.addEventListener("pointerdown", e => { if (!addMenu.hidden && !e.target.closest(".add-wrap")) setMenu(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !addMenu.hidden) { setMenu(false); addBtn.focus(); } });

  document.getElementById("toastUndo").addEventListener("click", () => {
    const fn = undoState; undoState = null;
    document.getElementById("toast").hidden = true;
    if (fn) fn();
  });
  phoneMQ.addEventListener("change", () => schedLayout());
  window.addEventListener("resize", () => schedLayout());

  loadLocal();
  if (!lists.has(PRI_ID)) lists.set(PRI_ID, { id: PRI_ID, title: "PRIORITIES", color: PRI_COLOR, x: 0, y: 0, z: 1, collapsed: false, created: Date.now(), items: [] });
  renderAll();
  iLoadLocal();
  renderAllIdeas();
  sLoadLocal();
  renderAllScheds();
  layoutReady = true;
  arrange();

  (async () => {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    if (!db) return;
    startIdeaSync();
    startSchedSync();
    let first = true;
    db.collection("lists").onSnapshot(snap => {
      if (first) {
        first = false;
        const remote = new Set(snap.docs.map(d => d.id));
        if (snap.empty && lists.size) { lists.forEach((_, id) => { pending.add(id); flush(id); }); return; }
        // anything only on this device from before sync: drop in favor of the saved copy
        [...lists.keys()].forEach(id => { if (!remote.has(id) && !pending.has(id)) { lists.delete(id); const c = cardEl(id); if (c) c.remove(); } });
      }
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        if (pending.has(id) || ch.doc.metadata.hasPendingWrites) return;
        if (ch.type === "removed") { lists.delete(id); const c = cardEl(id); if (c) c.remove(); return; }
        const data = ch.doc.data();
        if (!data || !Array.isArray(data.items)) return;
        const incoming = { ...data, id, items: data.items.map(i => ({ ...i })) };
        const cur = lists.get(id);
        if (cur && JSON.stringify(clean(cur)) === JSON.stringify(clean(incoming))) return;
        const card = cardEl(id);
        if (card && card.contains(document.activeElement)) return; // don't disturb typing
        lists.set(id, incoming);
        renderCard(id);
      });
      renderEmpty();
      layout();
      saveLocal();
    }, () => showStatus("Sync paused. Changes are kept on this device."));
  })();
})();
</script>
</body>
</html>
